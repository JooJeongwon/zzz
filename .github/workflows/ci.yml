name: ZZZ CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # 1. Backend Core (Spring Boot)
  backend-core-test:
    name: Backend Core Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/core-service
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Tests
      # Testcontainers will use the Docker environment provided by GitHub Actions runner
      run: ./gradlew test --info

  # 2. Backend AI (Python FastAPI)
  backend-ai-test:
    name: Backend AI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/ai-service
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio httpx
    - name: Run Tests
      run: |
        pytest

  # 3. Client (Flutter)
  client-flutter-test:
    name: Client Flutter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
    - uses: actions/checkout@v4
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    - name: Install dependencies
      run: flutter pub get
    - name: Run Linter
      run: dart analyze
    - name: Run Tests
      run: flutter test
