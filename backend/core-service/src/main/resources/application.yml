spring:
  application:
    name: core-service
  
  # Database Configuration (MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zzz_core?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:zzz_user}
    password: ${DB_PASSWORD:zzz_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:zzz_chat}
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD:rootpassword}
      authentication-database: admin

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# AI Service Integration (Custom Property)
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION_MS:2592000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
fcm:
  config-path: ${FCM_CONFIG_PATH:firebase-service-account.json}
